# Optional local stack for teams that already have Docker.
# SkillSwap AI does NOT require Docker. Prefer venv + npm for local development.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillswap
      POSTGRES_PASSWORD: skillswap
      POSTGRES_DB: skillswap
    ports:
      - "5432:5432"
    volumes:
      - skillswap_pg:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://skillswap:skillswap@db:5432/skillswap
      JWT_SECRET_KEY: local-dev-secret
      CORS_ORIGINS: http://localhost:5173
      AI_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  skillswap_pg:
